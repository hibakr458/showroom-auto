<div class="backdrop" (click)="close()">
  <div class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <button class="close" (click)="close()" aria-label="Close">✕</button>

    <img [src]="'images/' + car.photo" [alt]="car.brand + ' ' + car.model">

    <div class="info">
      <h2>{{ car.brand }} {{ car.model }}</h2>
      <p class="description">{{ car.description }}</p>

      <ul>
        <li><strong>Power:</strong> {{ car.power }}</li>
        <li><strong>Price:</strong> {{ car.price }} DNT</li>
        <li><strong>In stock:</strong> {{ car.availability }}</li>
      </ul>
    </div>
  </div>
</div>
