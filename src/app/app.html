<app-head-bar> </app-head-bar>
<app-filter-panel (onFilterChange)="onFilterChange($event)"> </app-filter-panel>
<app-search-bar
  [autos]="filteredAutos"
  [favorites]="favorites"
  (onSelectCar)="selectCar($event)"
  (onToggleFavorite)="toggleFavorite($event)">
</app-search-bar>


@if (selectedCar) {
  <section class="car-details">
    <img [src]="'images/' + selectedCar.photo" [alt]="selectedCar.brand + ' ' + selectedCar.model">

    <div class="info">
      <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
      <p class="description">{{ selectedCar.description }}</p>

      <ul>
        <li><strong>Power:</strong> {{ selectedCar.power }}</li>
        <li><strong>Price:</strong> {{ selectedCar.price }} DNT</li>
        <li><strong>In stock:</strong> {{ selectedCar.availability }}</li>
      </ul>
    </div>
  </section>
}
