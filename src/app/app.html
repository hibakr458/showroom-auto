<div class="app" [class.dark]="isDark">
  <app-head-bar [isDark]="isDark" (onToggleTheme)="toggleTheme()"></app-head-bar>

  <app-filter-panel (onFilterChange)="onFilterChange($event)"></app-filter-panel>

  <app-search-bar
    [autos]="filteredAutos"
    [favorites]="favorites"
    [compareList]="compareList"
    (onSelectCar)="selectCar($event)"
    (onToggleFavorite)="toggleFavorite($event)"
    (onToggleCompare)="toggleCompare($event)">
  </app-search-bar>

  @if (selectedCar) {
    <app-car-modal [car]="selectedCar" (onClose)="closeCar()"></app-car-modal>
  }

  <app-car-compare [cars]="compareList" (onClear)="clearCompare()"></app-car-compare>
</div>
